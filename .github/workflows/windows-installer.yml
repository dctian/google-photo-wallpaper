name: Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
          check-latest: true
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Offline tests
        run: python -m unittest discover -s tests -q
      - name: Build and verify standalone application
        shell: powershell
        run: ./scripts/Build-Windows.ps1
      - name: Install and uninstall in a clean test account
        run: |
          $setup = (Get-ChildItem dist/*-setup.exe).FullName
          python packaging/smoke_installed.py "$setup"
      - name: Upload verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          if-no-files-found: error
          path: |
            dist/*-setup.exe
            dist/pystray-0.19.5.tar.gz
            dist/runtime-inventory.json
