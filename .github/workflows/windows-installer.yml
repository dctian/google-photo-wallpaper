name: Windows installer
on:
  workflow_dispatch:
    inputs:
      sign:
        description: Request production SignPath signatures (requires approved onboarding)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check signing prerequisites
        if: ${{ inputs.sign }}
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG }}
        run: |
          if ($env:GITHUB_REPOSITORY -ne 'dctian/google-photo-wallpaper' -or $env:GITHUB_REF -ne 'refs/heads/main') { throw 'Production signing is restricted to the upstream main branch.' }
          foreach ($key in 'SIGNPATH_API_TOKEN','SIGNPATH_ORGANIZATION_ID','SIGNPATH_PROJECT_SLUG','SIGNPATH_POLICY_SLUG') {
            if (-not [Environment]::GetEnvironmentVariable($key)) { throw "Configure $key after SignPath approval." }
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
          check-latest: true
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Offline tests
        run: python -m unittest discover -s tests -q
      - name: Build and verify standalone application
        shell: powershell
        run: ./scripts/Build-Windows.ps1
      - name: Install and uninstall in a clean test account
        run: |
          $setup = (Get-ChildItem dist/*-setup.exe).FullName
          python packaging/smoke_installed.py "$setup"
      - name: Read application version
        id: version
        run: |
          $version = python -c "from photo_cache import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid application version.' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Upload application signing input
        if: ${{ inputs.sign }}
        id: app-input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-signing-input
          path: dist/GooglePhotoWallpaper/*.exe
      - name: Request application signatures
        if: ${{ inputs.sign }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: app-executables
          github-artifact-id: ${{ steps.app-input.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed-app
          parameters: |
            version: "${{ steps.version.outputs.value }}"
      - name: Verify application signatures and rebuild installer
        if: ${{ inputs.sign }}
        shell: powershell
        run: |
          $names = @('GooglePhotoWallpaper.exe','GooglePhotoWallpaper-cli.exe')
          $paths = @($names | ForEach-Object { Join-Path 'dist/signed-app' $_ })
          ./scripts/Verify-Signatures.ps1 -Paths $paths
          foreach ($name in $names) { Copy-Item -LiteralPath (Join-Path 'dist/signed-app' $name) -Destination (Join-Path 'dist/GooglePhotoWallpaper' $name) -Force }
          ./scripts/Build-Windows.ps1 -InstallerOnly
      - name: Upload installer signing input
        if: ${{ inputs.sign }}
        id: installer-input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-signing-input
          path: dist/*-setup.exe
      - name: Request installer signature
        if: ${{ inputs.sign }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.installer-input.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed-installer
          parameters: |
            version: "${{ steps.version.outputs.value }}"
      - name: Verify final installer signature
        if: ${{ inputs.sign }}
        shell: powershell
        run: |
          $name = 'google-photo-wallpaper-${{ steps.version.outputs.value }}-windows-x64-setup.exe'
          ./scripts/Verify-Signatures.ps1 -Paths @("dist/signed-installer/$name")
          Copy-Item -LiteralPath "dist/signed-installer/$name" -Destination "dist/$name" -Force
          python packaging/smoke_installed.py "dist/$name"
      - name: Upload verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          if-no-files-found: error
          path: |
            dist/*-setup.exe
            dist/pystray-0.19.5.tar.gz
            dist/runtime-inventory.json
